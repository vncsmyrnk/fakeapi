name: CI workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    container: golang:1.23-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: lint
        run: just lint

      - name: test
        run: just test

      - name: coverage
        run: just coverage

      - name: upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
