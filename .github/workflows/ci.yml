name: CI workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    container: golang:1.25-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: Lint
        run: just lint

      - name: Run unit tests
        run: just unit-test

      - name: Run integration tests
        run: just integration-test

      - name: Runs test coverage
        run: just coverage

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  codecov:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: download ci artifacts
        id: download-build-artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: .

      - name: list artifacts
        run: ls -lh .

      - name: upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vncsmyrnk/fakeapi
          files: coverage.txt
          fail_ci_if_error: true
