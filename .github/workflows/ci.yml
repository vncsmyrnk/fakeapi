name: CI workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  packages: write

jobs:
  ci-go:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - uses: extractions/setup-just@v2

      - name: Lint
        run: just lint

  ci-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check

      - name: Build flake
        run: nix build
