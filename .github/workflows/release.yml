name: Release workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.23'

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }}
          GOARCH=${{ matrix.goarch }}
          VERSION=${{ github.ref_name }}
          COMMIT=$(git rev-parse HEAD)

          go build \
            -ldflags "-X 'fakeapi/internal/version.Version=$VERSION' \
                      -X 'fakeapi/internal/version.Commit=$COMMIT'" \
            -o dist/fakeapi-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/fakeapi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fakeapi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish-docker-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          target: vote-summary-generator
          tags: |
            vncsmyrnk/fakeapi:latest
            vncsmyrnk/fakeapi:${{ github.event.release.tag_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        id: download-build-artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List build artifacts generated
        run: ls ./artifacts/**/*

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*
          body: |
            # Changelog

            ${{ steps.github_release.outputs.changelog }}

            Check the release assets for the binaries. To install it, just download the correct version for your system and move it to an executable path
