name: Server release workflow

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/server/VERSION'

  workflow_dispatch:

jobs:
  ci:
    name: Validates Nix flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check

      - name: Builds all packages
        run: nix build .#all

  docker-build:
    name: Builds Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Installs Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: nix build .#docker -L

      - name: Loads it into Docker
        run: docker load < result

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          image_name=$(tar -xOf result manifest.json | jq -r '.[0].RepoTags[0]')
          version_tag=$(echo $image_name | cut -d ':' -f2)
          docker tag $image_name "vncsmyrnk/fakeapi:$version_tag"
          docker tag $image_name "vncsmyrnk/fakeapi:latest"
          docker push --all-tags "vncsmyrnk/fakeapi"

      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub container registry
        run: |
          image_name=$(tar -xOf result manifest.json | jq -r '.[0].RepoTags[0]')
          version_tag=$(echo $image_name | cut -d ':' -f2)
          docker tag $image_name "ghcr.io/${{ github.repository_owner }}/fakeapi:$version_tag"
          docker tag $image_name "ghcr.io/${{ github.repository_owner }}/fakeapi:latest"
          docker push --all-tags "ghcr.io/${{ github.repository_owner }}/fakeapi"
