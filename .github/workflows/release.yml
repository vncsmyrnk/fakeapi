name: Release workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    name: Validates Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check

      - name: Builds all packages
        run: nix build .#all

  docker-build:
    name: Builds Docker image via nix
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installs Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: nix build .#docker -L

      - name: Loads it into Docker
        run: docker load < result

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Container registry
        run: |
          image_name=$(tar -xOf result manifest.json | jq -r '.[0].RepoTags[0]')
          version_tag=$(echo $image_name | cut -d ':' -f2)
          docker tag $image_name "${{ github.repository_owner }}/fakeapi:$version_tag"
          docker tag $image_name "${{ github.repository_owner }}/fakeapi:latest"
          docker push --all-tags "${{ github.repository_owner }}/fakeapi"

  release:
    name: Creates GitHub Release
    needs: [ci, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            # Changelog

            ${{ steps.github_release.outputs.changelog }}
