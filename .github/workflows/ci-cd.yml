name: CI/CD workflow

on:
  push:
  pull_request:

permissions:
  packages: write

jobs:
  ci-go:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true

      - uses: extractions/setup-just@v2

      - name: Lint
        run: just lint

  ci-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check

      - name: Build flake
        run: nix build

  ci-pkgbuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch Package
        uses: edlanglois/pkgbuild-action@v1
        with:
          namcap: true

  ci-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install dependencies
        run: luarocks install luacheck

      - name: Lint
        run: luacheck .

      - name: Check Formatting
        uses: JohnnyMorganz/StyLua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  cd-check:
    needs: [ci-go, ci-nix, ci-lua, ci-pkgbuild]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      server-version-changed: ${{ steps.filter.outputs.server-version-changed }}
      cli-version-changed: ${{ steps.filter.outputs.cli-version-changed }}
      lua-rockspec-changed: ${{ steps.filter.outputs.lua-rockspec-changed }}
      pkgbuild-changed: ${{ steps.filter.outputs.pkgbuild-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for server version change
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server-version-changed:
              - 'cmd/server/VERSION'
            cli-version-changed:
              - 'cmd/cli/VERSION'
            lua-rockspec-changed:
              - 'api/lua/**/*.rockspec'
            pkgbuild-changed:
              - 'PKGBUILD'

  cd-dockerhub:
    needs: cd-check
    runs-on: ubuntu-latest
    if: ${{ needs.cd-check.outputs.server-version-changed == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Installs Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: nix build .#docker -L

      - name: Loads it into Docker
        run: docker load < result

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          image_name=$(tar -xOf result manifest.json | jq -r '.[0].RepoTags[0]')
          version_tag=$(echo $image_name | cut -d ':' -f2)
          docker tag $image_name "vncsmyrnk/fakeapi:$version_tag"
          docker tag $image_name "vncsmyrnk/fakeapi:latest"
          docker push --all-tags "vncsmyrnk/fakeapi"

      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub container registry
        run: |
          image_name=$(tar -xOf result manifest.json | jq -r '.[0].RepoTags[0]')
          version_tag=$(echo $image_name | cut -d ':' -f2)
          docker tag $image_name "ghcr.io/${{ github.repository_owner }}/fakeapi:$version_tag"
          docker tag $image_name "ghcr.io/${{ github.repository_owner }}/fakeapi:latest"
          docker push --all-tags "ghcr.io/${{ github.repository_owner }}/fakeapi"

  cd-apt:
    runs-on: ubuntu-latest
    needs: cd-check
    if: ${{ needs.cd-check.outputs.cli-version-changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - uses: extractions/setup-just@v4

      - name: Build CLI
        run: just build-cli

      - name: Install packaging dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install fpm

      - name: Package it using fpm
        run: |
          mkdir -p staging-root/usr/bin
          cp ./dist/* staging-root/usr/bin/

          VERSION=$(cat cmd/cli/VERSION)
          fpm -s dir -t deb \
            -n fakeapi \
            -v $VERSION \
            -a amd64 \
            --maintainer "Vinicius Mayrink <vncsmyrnk@gmail.com>" \
            --description "ustomizable local REST API for testing." \
            --license "GPL-3.0" \
            --url "https://github.com/vncsmyrnk/fakeapi" \
            -C staging-root .

      - name: Upload to Gemfury
        run: |
          DEB_FILE=$(find . -name '*.deb' -type f | head -n 1)
          curl -F package=@$DEB_FILE https://${{ secrets.GEMFURY_PUSH_TOKEN }}@push.fury.io/vncsmyrnk

  cd-pkgbuild:
    needs: cd-check
    if: ${{ needs.cd-check.outputs.pkgbuild-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: fakeapi-git
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update AUR package"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  cd-luarocks:
    runs-on: ubuntu-latest
    needs: cd-check
    if: ${{ needs.cd-check.outputs.lua-rockspec-changed == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Upload Rockspec
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          luarocks install dkjson --local --lua-version=5.1
          luarocks upload api/lua/*.rockspec --api-key=$LUAROCKS_API_KEY
